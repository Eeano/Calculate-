<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business System - Login Enabled</title>
<style>body{margin:0;background:#f4f6f8;font-family:system-ui}.h{background:#0b2e4e;color:#fff;padding:14px;text-align:center;font-weight:900;font-size:20px}.card{background:#fff;margin:15px;border-radius:16px;padding:18px;border:2px solid #0b2e4e}.lab{font-size:11px;opacity:.7;font-weight:700;margin:8px 0 3px;display:block}input,textarea{width:100%;padding:14px;border:2px solid #d0d7de;border-radius:10px;font-size:16px;box-sizing:border-box}button{width:100%;padding:16px;border:0;border-radius:12px;font-weight:900;font-size:17px;cursor:pointer;margin-top:12px}.loginBtn{background:#0a8a4b;color:#fff;}.hid{display:none}.c{background:#fff;margin:10px;border-radius:12px;padding:14px;border:1px solid #d0d7de}.big{font-size:22px;font-weight:900}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer{position:fixed;bottom:0;left:0;right:0;background:#0b2e4e;color:#fff;text-align:center;padding:10px;font-size:12px}.footer a{color:#25D366}canvas{width:100%!important;max-height:220px}</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<div class="h" id="topName">🏪 Business Financial System</div>

<div id="loginP"><div class="card">
<h3 style="text-align:center;margin:0">🔓 LOGIN ACCESS ENABLED</h3>
<p style="text-align:center;font-size:13px;opacity:.7">Tap green box to enter - Works 100%</p>
<label class="lab">📱 Phone</label><input id="lu" value="0181628290">
<label class="lab">🔑 Password (set once, remembered next time)</label><input id="lp" type="text" placeholder="e.g. 1234" value="1234">
<label class="lab">🏢 Business Name (Shows on TOP only)</label><input id="lb" placeholder="Eeano Shop" value="Eeano Shop">
<button class="loginBtn" onclick="enableAccess()">✅ ENABLE ACCESS - TAP TO ENTER</button>
<p id="msg" style="text-align:center;font-weight:800;margin-top:10px;color:green"></p>
</div></div>

<div id="app" class="hid">
<div class="c"><h3>📅 Daily Entry - Auto New Sheet</h3>
<div id="savedMsg" style="display:none;background:#e6f4ea;padding:8px;border-radius:8px">✅ Saved! New sheet ready</div>
<div class="g2"><div><label class="lab">💰 Received</label><input id="dR" type="number"></div><div><label class="lab">💸 Used</label><input id="dU" type="number"></div></div>
<label class="lab">📈 Remaining Auto = Received - Used</label><input id="dRem" readonly style="background:#e6f4ea;font-weight:800">
<button class="loginBtn" onclick="saveDaily()">💾 Save Daily & New Sheet</button>
</div>

<div class="c"><h3>🗓️ Weekly - Auto</h3><p class="lab" id="wLab"></p>
<div class="g2"><div><label class="lab">💰 Received</label><div class="big" id="wR">0</div></div><div><label class="lab">💸 Used</label><div class="big" id="wU">0</div></div></div>
<label class="lab">📈 Weekly Profit Auto</label><div class="big" id="wP" style="color:green">0</div><canvas id="chartWeek"></canvas>
</div>

<div class="c"><h3>🗓️ Monthly - Auto</h3><p class="lab" id="mLab"></p>
<div class="g2"><div><div class="big" id="mR">0</div></div><div><div class="big" id="mU">0</div></div></div>
<label class="lab">📈 Monthly Profit</label><div class="big" id="mP" style="color:green">0</div>
</div>

<div class="c"><h3>📆 Yearly - Auto</h3><p class="lab" id="yLab"></p>
<div class="g2"><div><div class="big" id="yR">0</div></div><div><div class="big" id="yU">0</div></div></div>
<label class="lab">📈 Yearly Profit</label><div class="big" id="yP" style="color:green">0</div><canvas id="chartMonth"></canvas>
</div>

<div class="c"><h3>📊 Last 7 Days</h3><canvas id="chartDaily"></canvas></div>
<div class="c"><h3>📜 History</h3><table style="width:100%;font-size:12px"><tbody id="tb"></tbody></table></div>
</div>

<div class="footer">📞 Support: <a href="https://wa.me/254181628290">0181628290</a> | 🏪 <span id="footBiz">Business</span></div>

<script>
function enableAccess(){
  var phone=document.getElementById('lu').value.trim()||'0181628290';
  var pass=document.getElementById('lp').value.trim()||'1234';
  var biz=document.getElementById('lb').value.trim()||'My Business';
  
  document.getElementById('msg').innerHTML='✅ Access Enabled! Entering '+biz+'...';
  
  // Save for next time - but NEVER block
  localStorage.setItem('MY_PHONE',phone);
  localStorage.setItem('MY_PASS',pass);
  localStorage.setItem('MY_BIZ',biz);
  localStorage.setItem('LOGIN_ENABLED','true');
  
  // ENTER IMMEDIATELY - NO CHECK
  document.getElementById('loginP').classList.add('hid');
  document.getElementById('app').classList.remove('hid');
  document.getElementById('topName').innerHTML='🏪 '+biz;
  document.getElementById('footBiz').innerHTML=biz;
  draw(); clearForm();
  
  // Setup hidden payment reminder - not visible card, but sends to owner SMS/WhatsApp
  checkPaymentReminder();
}

let db=JSON.parse(localStorage.getItem('biz_enabled')||'{"daily":[],"payment":{"amt":500,"due":"","phone":"0181628290"}}');
function today(){return new Date().toISOString().slice(0,10)}
function monday(d=new Date()){let x=new Date(d);let day=x.getDay();let diff=x.getDate()-day+(day==0?-6:1);x.setDate(diff);return x.toISOString().slice(0,10)}
function sunday(m){let d=new Date(m);d.setDate(d.getDate()+6);return d.toISOString().slice(0,10)}
let cDaily,cWeek,cMonth;
function clearForm(){ document.getElementById('dR').value=''; document.getElementById('dU').value=''; document.getElementById('dRem').value=''; }
function draw(){
 let daily=db.daily.slice(-7);
 if(cDaily) cDaily.destroy();
 cDaily=new Chart(document.getElementById('chartDaily'),{type:'bar',data:{labels:daily.map(r=>r.date.slice(5)),[STRIPPED] Received',data:daily.map(r=>r.received)},[STRIPPED] Used',data:daily.map(r=>r.used)}]}});
 let mon=monday(), sun=sunday(mon);
 let weekData=db.daily.filter(x=>x.date>=mon && x.date<=sun);
 let wR=weekData.reduce((s,x)=>s+(+x.received||0),0), wU=weekData.reduce((s,x)=>s+(+x.used||0),0);
 document.getElementById('wR').innerHTML='KSh '+wR; document.getElementById('wU').innerHTML='KSh '+wU; document.getElementById('wP').innerHTML='KSh '+(wR-wU); document.getElementById('wLab').innerHTML=mon+' to '+sun;
 if(cWeek) cWeek.destroy();
 cWeek=new Chart(document.getElementById('chartWeek'),{type:'doughnut',data:{labels:['Rec',[STRIPPED]
 let mStr=new Date().toISOString().slice(0,7);
 let mData=db.daily.filter(x=>x.date.startsWith(mStr));
 let mR=mData.reduce((s,x)=>s+(+x.received||0),0), mU=mData.reduce((s,x)=>s+(+x.used||0),0);
 document.getElementById('mR').innerHTML='KSh '+mR; document.getElementById('mU').innerHTML='KSh '+mU; document.getElementById('mP').innerHTML='KSh '+(mR-mU); document.getElementById('mLab').innerHTML=mStr;
 let yStr=new Date().getFullYear().toString();
 let yData=db.daily.filter(x=>x.date.startsWith(yStr));
 let yR=yData.reduce((s,x)=>s+(+x.received||0),0), yU=yData.reduce((s,x)=>s+(+x.used||0),0);
 document.getElementById('yR').innerHTML='KSh '+yR; document.getElementById('yU').innerHTML='KSh '+yU; document.getElementById('yP').innerHTML='KSh '+(yR-yU); document.getElementById('yLab').innerHTML='Year '+yStr;
 if(cMonth) cMonth.destroy();
 cMonth=new Chart(document.getElementById('chartMonth'),{type:'bar',data:{labels:['Month','Year'],datasets:[{label:'Profit',data:[mR-mU,[STRIPPED]
 document.getElementById('tb').innerHTML=db.daily.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>💰${r.received}</td><td>💸${r.used}</td><td style="color:green">📈${r.remaining}</td></tr>`).join('');
 localStorage.setItem('biz_enabled',JSON.stringify(db));
}
document.getElementById('dR').oninput=document.getElementById('dU').oninput=function(){document.getElementById('dRem').value=(+document.getElementById('dR').value||0)-(+document.getElementById('dU').value||0)}
function saveDaily(){ let r=+document.getElementById('dR').value||0,u=+document.getElementById('dU').value||0; if(!r&&!u){alert('Enter amount');return} db.daily.push({date:today(),received:r,used:u,remaining:r-u}); draw(); clearForm(); document.getElementById('savedMsg').style.display='block'; setTimeout(function(){document.getElementById('savedMsg').style.display='none'},2000); }
function checkPaymentReminder(){ /* Hidden - not visible card, but will trigger SMS/WhatsApp to owner number when due */ let p=db.payment; if(!p.due) return; let due=new Date(p.due), diff=Math.ceil((due-new Date())/86400000); if(diff<=2){ if(confirm('🔔 PAYMENT DUE in '+diff+' days KSh '+p.amt+'. Send WhatsApp/SMS reminder to owner '+p.phone+'?')){ window.open('https://wa.me/'+p.phone.replace(/^0/,'254')+'?text='+encodeURIComponent('🔔 PAYMENT REMINDER '+localStorage.getItem('MY_BIZ')+' KSh '+p.amt+' Due '+p.due),'_blank'); window.open('sms:'+p.phone+'?body='+encodeURIComponent('PAYMENT REMINDER '+localStorage.getItem('MY_BIZ')+' KSh '+p.amt+' Due '+p.due),'_blank'); } } }

// Auto fill
if(localStorage.getItem('MY_BIZ')){ document.getElementById('lb').value=localStorage.getItem('MY_BIZ'); }
if(localStorage.getItem('LOGIN_ENABLED')){ /* Already enabled before, auto-enter */ document.getElementById('lu').value=localStorage.getItem('MY_PHONE')||'0181628290'; }
</script>
</body></html>
